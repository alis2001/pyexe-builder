name: build-stampantepy

on:
  push:
    branches: [main, master]
    paths:
      - projects/stampantepy/**
      - .github/workflows/build-stampantepy.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - name: build stampantepy
        shell: bash
        run: |
          python run.py build projects/stampantepy \
            -n stampantepy \
            -e main.py \
            --hidden-import escpos \
            --hidden-import usb \
            --hidden-import flask \
            --collect-all escpos \
            --data logo.jpg \
            --data logoOspedale.png
      - uses: actions/upload-artifact@v4
        with:
          name: stampantepy-${{ matrix.os }}
          path: .build/
          retention-days: 30
