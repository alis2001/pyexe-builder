name: build-stampantepy

on:
  push:
    branches: [main, master]
    paths:
      - projects/stampantepy/**
      - .github/workflows/build-stampantepy.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - name: build stampantepy
        shell: bash
        run: |
          python run.py build projects/stampantepy \
            -n stampantepy \
            -e main.py \
            --hidden-import escpos \
            --hidden-import usb \
            --hidden-import flask \
            --collect-all escpos \
            --data logo.jpg \
            --data logoOspedale.png
      - name: stage artifact
        shell: bash
        run: |
          DIST_DIR=$(find .build -type d -path "*/dist/stampantepy" 2>/dev/null | head -1)
          if [ -z "$DIST_DIR" ]; then
            echo "build output not found"
            find .build 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist-artifact
          cp -a "$DIST_DIR" dist-artifact/stampantepy
          ls -laR dist-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: stampantepy-${{ matrix.os }}
          path: dist-artifact/
          if-no-files-found: error
          retention-days: 30
