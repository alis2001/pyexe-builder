name: build-project

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Path to python project inside the repo
        required: true
        default: examples/hello
      app_name:
        description: Output executable name
        required: true
        default: hello
      entry_point:
        description: Entry python file
        required: true
        default: main.py
      hidden_imports:
        description: Comma-separated hidden imports (optional)
        required: false
        default: flask

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - name: build
        shell: bash
        run: |
          ARGS=()
          IFS=',' read -ra MODS <<< "${{ inputs.hidden_imports }}"
          for mod in "${MODS[@]}"; do
            mod="$(echo "$mod" | xargs)"
            [ -n "$mod" ] && ARGS+=(--hidden-import "$mod")
          done
          python run.py build "${{ inputs.project_path }}" \
            -n "${{ inputs.app_name }}" \
            -e "${{ inputs.entry_point }}" \
            "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ matrix.os }}
          path: .build/
          retention-days: 30
