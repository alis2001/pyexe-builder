name: build-project

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Path to python project inside the repo
        required: true
        default: examples/hello
      app_name:
        description: Output executable name
        required: true
        default: hello
      entry_point:
        description: Entry python file
        required: true
        default: main.py
      hidden_imports:
        description: Comma-separated hidden imports (optional)
        required: false
        default: flask

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - name: build
        shell: bash
        run: |
          ARGS=()
          IFS=',' read -ra MODS <<< "${{ inputs.hidden_imports }}"
          for mod in "${MODS[@]}"; do
            mod="$(echo "$mod" | xargs)"
            [ -n "$mod" ] && ARGS+=(--hidden-import "$mod")
          done
          python run.py build "${{ inputs.project_path }}" \
            -n "${{ inputs.app_name }}" \
            -e "${{ inputs.entry_point }}" \
            "${ARGS[@]}"
      - name: stage artifact
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          DIST_DIR=$(find .build -type d -path "*/dist/${APP_NAME}" 2>/dev/null | head -1)
          if [ -z "$DIST_DIR" ]; then
            echo "build output not found"
            find .build 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist-artifact
          cp -a "$DIST_DIR" "dist-artifact/${APP_NAME}"
          ls -laR dist-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ matrix.os }}
          path: dist-artifact/
          if-no-files-found: error
          retention-days: 30
